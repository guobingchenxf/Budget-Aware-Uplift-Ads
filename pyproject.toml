[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-aware-uplift-ads"
version = "0.1.0"
description = "Budget-Aware Uplift Ads: 预算约束下的增量转化广告排序与投放节奏优化（研究型原型）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TODO: 你的名字" }]
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.10"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
baua = "baua.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "artifacts", "data", "_smoke_out"]

[tool.ruff.lint]
# E/F 是基础错误，I 是 import 排序，B 是常见陷阱，UP 是现代化建议，C4/SIM 是简化建议
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",  # 行宽：中文注释与表格字符串不适合强制换行
    "B905",  # zip(strict=) 需要 py3.10+ 才常用；本项目保持兼容写法
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]          # 测试中允许 assert True 之类的写法
"src/baua/_legacy*.py" = ["ALL"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# 渐进式：先让核心模块通过，逐步收紧；不允许用 type: ignore 掩盖真问题
files = ["src/baua"]
exclude = ["src/baua/_legacy"]
